<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tristan Homsi</title>
  <meta name="description" content="Tristan Homsi's personal site.">
  <style>
    :root {
      --bg: #fbfaf7;
      --fg: #1c1b19;
      --muted: #6b6862;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514;
        --fg: #ecebe8;
        --muted: #9a978f;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 18px/1.6 ui-serif, Georgia, "Times New Roman", serif;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    main { max-width: 34rem; width: 100%; }
    h1 { font-size: 2.25rem; font-weight: 500; letter-spacing: -0.01em; margin: 0 0 0.5rem; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Tristan Homsi</h1>
    <p>New site coming soon.</p>
  </main>
</body>
</html>
