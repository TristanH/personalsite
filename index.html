<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tristan Homsi's bookshelf</title>
  <meta name="description" content="Every book Tristan Homsi has finished, on one shelf, lit by how much he liked it.">
  <meta name="theme-color" content="#432230">
  <link rel="preload" href="data/books.json" as="fetch" crossorigin>
  <link rel="preload" href="fonts/anybody-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: Anybody;
      src: url(fonts/anybody-latin.woff2) format("woff2");
      font-weight: 100 900;
      font-stretch: 50% 150%;
      font-display: swap;
    }
    :root {
      /* Overwritten from the seed in script; these are the defaults for seed 5e2673…3765. */
      --wall: hsl(344 27% 37%);
      --wall-deep: hsl(344 31% 20%);
      --plank: hsl(37 42% 30%);
      --plank-top: hsl(41 38% 46%);
      --plank-dark: hsl(37 42% 13.5%);
      --floor: hsl(37 32% 22%);
      --ink: hsl(30 75% 93%);
      --ink-dim: hsl(30 37% 80%);
      --glow: hsl(34 95% 62%);
      --shelf-h: 210px;
      --tilt-x: -4deg;
      --tilt-y: -2deg;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { background: var(--wall-deep); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Anybody, system-ui, sans-serif;
      font-variation-settings: "wdth" 100;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .room {
      position: fixed;
      inset: -12px;
      z-index: -1;
      pointer-events: none;
      contain: strict;
      /* A lamp in the top corner, limewash blotches, the corners falling off into evening. */
      background:
        radial-gradient(60% 50% at 86% 4%, hsl(36 95% 70% / .16), transparent 70%),
        radial-gradient(30% 25% at 20% 30%, rgb(255 240 220 / .05), transparent),
        radial-gradient(35% 30% at 60% 70%, rgb(0 0 0 / .06), transparent),
        radial-gradient(140% 100% at 50% 20%, transparent 60%, rgb(20 5 0 / .18)),
        radial-gradient(120% 80% at 30% 0%, color-mix(in oklab, var(--wall) 85%, hsl(36 90% 80%)) 0%, var(--wall) 50%, var(--wall-deep) 100%);
    }
    .ceiling { position: absolute; top: 0; left: 0; right: 0; z-index: -1; pointer-events: none; }
    .ceiling img, .floor img { display: block; }
    .floor { margin-top: -60px; pointer-events: none; overflow: hidden; }
    .plant {
      position: relative;
      flex: none;
      /* Nudged forward so trailing vines hang in front of the plank, not behind it. */
      transform: translateZ(6px);
    }
    .plant img { position: absolute; top: 0; max-width: none; }
    /* Each shelf skips layout and paint until it's near the viewport. The clip margin
       leaves room for vines, glow and books pulled off the shelf. */
    .shelf {
      content-visibility: auto;
      contain-intrinsic-size: auto 300px;
      overflow-clip-margin: 160px;
    }

    header {
      position: relative;
      max-width: 1240px;
      margin: 0 auto;
      padding: 44px 32px 0;
    }
    h1 {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0 .22em;
      margin: 0;
      font-size: clamp(36px, 5.2vw, 68px);
      line-height: .95;
      font-weight: 700;
      font-variation-settings: "wdth" 100;
      letter-spacing: -.02em;
      color: var(--ink);
    }
    h1 span {
      font-weight: 300;
      font-variation-settings: "wdth" 50;
      letter-spacing: -.01em;
      color: var(--ink-dim);
    }
    .intro {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 18px 40px;
      margin-top: 22px;
    }
    .intro p {
      margin: 0;
      max-width: 40em;
      font-size: 17px;
      text-wrap: pretty;
      line-height: 1.5;
      color: var(--ink-dim);
    }
    .intro p strong { color: var(--ink); font-weight: 600; }
    .glow-word {
      color: var(--glow);
      text-shadow: 0 0 14px color-mix(in oklab, var(--glow) 70%, transparent);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .toggle {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      background: color-mix(in oklab, var(--wall-deep) 70%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--ink) 18%, transparent);
    }
    .toggle button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 7px 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 550;
      color: var(--ink-dim);
      background: transparent;
      cursor: pointer;
    }
    .toggle button[aria-pressed="true"] {
      color: var(--wall-deep);
      background: var(--ink);
    }
    .search {
      width: 230px;
      padding: 9px 14px;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-size: 15px;
      color: var(--ink);
      background: color-mix(in oklab, var(--wall-deep) 70%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--ink) 18%, transparent);
    }
    .search::placeholder { color: color-mix(in oklab, var(--ink-dim) 75%, transparent); }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    /* ---------- Shelves ---------- */
    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 40px 32px 40px;
    }
    .group { margin-bottom: 14px; }
    .group-name {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 18px 0 22px 14px;
      font-size: 30px;
      font-weight: 800;
      font-variation-settings: "wdth" 135;
      letter-spacing: -.015em;
    }
    .group-name small { font-size: 15px; font-weight: 450; font-variation-settings: "wdth" 100; letter-spacing: 0; color: var(--ink-dim); }
    .row {
      position: relative;
      transform-style: preserve-3d;
      transform: perspective(1500px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      margin-bottom: 30px;
    }
    .books {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: var(--shelf-h);
      padding: 0 14px;
      transform-style: preserve-3d;
    }
    /* The shelf layers are coplanar with the books in 3D and can win hit-testing;
       only books take pointer events. */
    .row, .row * { pointer-events: none; }
    .row .book { pointer-events: auto; }
    .plank {
      position: relative;
      height: 22px;
      transform-style: preserve-3d;
      background:
        repeating-linear-gradient(90deg, rgb(0 0 0 / .07) 0 1px, transparent 1px 23px, rgb(255 230 190 / .05) 23px 25px, transparent 25px 41px),
        linear-gradient(180deg, var(--plank-top) 0%, var(--plank) 18%, var(--plank) 70%, var(--plank-dark) 100%);
      border-radius: 1px 1px 3px 3px;
      box-shadow:
        0 22px 30px -10px rgb(0 0 0 / .55),
        0 2px 0 color-mix(in oklab, var(--plank-top) 60%, white) inset;
    }
    .plank::before {
      /* The plank's top surface, receding into the wall. */
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 100%;
      height: 150px;
      transform-origin: bottom;
      transform: rotateX(90deg);
      background:
        repeating-linear-gradient(90deg, rgb(0 0 0 / .06) 0 1px, transparent 1px 31px, rgb(255 230 190 / .05) 31px 33px, transparent 33px 57px),
        linear-gradient(0deg, var(--plank-top), color-mix(in oklab, var(--plank) 70%, black) 90%);
    }
    .label {
      position: absolute;
      left: 14px;
      top: 100%;
      margin-top: 10px;
      display: flex;
      align-items: baseline;
      gap: 10px;
      white-space: nowrap;
    }
    .label b {
      font-size: 22px;
      font-weight: 800;
      font-variation-settings: "wdth" 130;
      letter-spacing: -.01em;
    }
    .label small {
      font-size: 14px;
      color: var(--ink-dim);
    }
    .row.has-label { margin-bottom: 64px; }
    .label.aisle b { font-size: 15px; font-weight: 600; font-variation-settings: "wdth" 100; letter-spacing: 0; color: var(--ink-dim); }
    .row:has(.label.aisle) { margin-bottom: 52px; }

    /* ---------- Books ---------- */
    .book {
      --g: 0;
      position: relative;
      flex: none;
      width: var(--w);
      height: var(--h);
      padding: 0;
      border: 0;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: opacity .25s;
      background: none;
      font: inherit;
      color: var(--fg);
    }
    /* Everything visible moves on this inner layer; the button itself never moves,
       so the hover target stays put and a lifting book can't slide out from under the pointer. */
    .book .lift {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform .32s cubic-bezier(.2, .8, .2, 1);
    }
    .book .spine {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 10px;
      overflow: hidden;
      border-radius: 2px 2px 1px 1px;
      background: var(--bg);
      box-shadow: 0 0 calc(var(--g) * 16px) 0 color-mix(in oklab, var(--glow) calc(var(--g) * 42%), transparent);
    }
    .book .spine::after {
      /* Rounded-spine shading. */
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg,
        rgb(0 0 0 / .45) 0%, rgb(255 255 255 / .10) 22%, rgb(255 255 255 / .16) 34%,
        rgb(0 0 0 / 0) 55%, rgb(0 0 0 / .32) 92%, rgb(0 0 0 / .55) 100%),
        linear-gradient(180deg, rgb(255 255 255 / .06), rgb(0 0 0 / .22));
    }
    .book .band {
      position: absolute;
      left: 0; right: 0;
      background: var(--accent);
    }
    .book .title {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      writing-mode: vertical-rl;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: var(--fs);
      font-weight: var(--fw);
      font-variation-settings: "wdth" var(--wd);
      line-height: 1;
      letter-spacing: .01em;
    }
    .book.no-author .author { display: none; }
    .book.two .title {
      white-space: normal;
      text-wrap: balance;
      text-overflow: clip;
      line-height: 1.05;
    }
    .book .author {
      position: relative;
      z-index: 1;
      margin-top: 8px;
      writing-mode: vertical-rl;
      white-space: nowrap;
      overflow: hidden;
      max-height: 34%;
      text-overflow: ellipsis;
      font-size: var(--afs);
      font-weight: 450;
      font-variation-settings: "wdth" 70;
      opacity: .78;
    }
    .book .lift::before {
      /* Top edge: page block between two boards. */
      content: "";
      position: absolute;
      left: 0; top: 0;
      width: 100%;
      height: var(--d);
      transform-origin: top;
      transform: rotateX(-90deg);
      background: linear-gradient(90deg, var(--bg) 0 2px, #d9cdb4 2px calc(100% - 2px), var(--bg) calc(100% - 2px));
      filter: brightness(.62);
    }
    .book::after {
      /* Light pool the rating casts onto the plank. */
      content: "";
      position: absolute;
      left: 50%;
      bottom: -14px;
      width: calc(var(--w) * 3 + 40px);
      height: 34px;
      transform: translateX(-50%);
      pointer-events: none;
      opacity: calc(var(--g) * .4);
      /* No mix-blend-mode here: it flattens the book's 3D faces in Chrome. */
      background: radial-gradient(closest-side, color-mix(in oklab, var(--glow) 70%, transparent), transparent);
    }
    .book .face {
      position: absolute;
      top: 0;
      left: 100%;
      width: var(--d);
      height: 100%;
      transform-origin: left;
      transform: rotateY(90deg);
      background: var(--bg);
      backface-visibility: hidden;
    }
    .book .face img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .book .face::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgb(0 0 0 / .35), rgb(0 0 0 / 0) 18%);
    }
    /* Face-out: cover to the room, leaning back against the wall. */
    .book.out .lift {
      transform-origin: 50% 100%;
      transform: rotateX(5deg);
    }
    .front {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 1px 3px 3px 1px;
      background: var(--bg);
      box-shadow:
        0 0 calc(var(--g) * 18px) 0 color-mix(in oklab, var(--glow) calc(var(--g) * 42%), transparent),
        6px 10px 18px -6px rgb(0 0 0 / .6);
    }
    .front img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Covers fade up over the book's own color once they've loaded, instead of popping in. */
    .face img, .front img { opacity: 0; transition: opacity .35s ease; }
    .face img.ready, .front img.ready { opacity: 1; }
    .front::after {
      /* Hinge crease and a soft sheen. */
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgb(0 0 0 / .4) 0, rgb(255 255 255 / .18) 2.5%, rgb(0 0 0 / .12) 5%, transparent 9%),
        linear-gradient(115deg, rgb(255 255 255 / .1), transparent 40%, rgb(0 0 0 / .18));
    }
    .front .made-cover { padding: 12px 10px; }
    .front .made-cover b { font-size: calc(var(--w) * .16); }
    .front .made-cover i { font-size: 11px; }
    @media (hover: hover) {
      /* Pull the book off the shelf and swing its cover round to face the room. */
      .book:hover .lift, .book:focus-visible .lift {
        transform-origin: 0 100%;
        transform: translateZ(64px) translateY(-14px) rotateY(-60deg);
      }
      .book.out:hover .lift, .book.out:focus-visible .lift {
        transform-origin: 50% 100%;
        transform: translateZ(28px) translateY(-8px) rotateX(0deg);
      }
    }
    .book:focus-visible { outline-offset: 4px; }
    .dimmed .book:not(.match) { opacity: .16; }

    .entering .book { animation: drop .7s cubic-bezier(.3, 1.35, .5, 1) backwards; animation-delay: calc(var(--i) * 9ms); }
    @keyframes drop {
      from { transform: translateY(-60px) rotateZ(var(--rot)); opacity: 0; }
    }

    .empty {
      display: none;
      padding: 40px 0 80px;
      font-size: 18px;
      color: var(--ink-dim);
    }
    .empty.show { display: block; }

    /* ---------- Detail ---------- */
    /* --panel fades the dialog's surface without fading the book flying into it. */
    @property --panel { syntax: "<number>"; inherits: true; initial-value: 1; }
    dialog {
      width: min(920px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      padding: 0;
      border: 0;
      border-radius: 6px;
      color: var(--ink);
      background:
        radial-gradient(90% 90% at 25% 30%,
          color-mix(in oklab, color-mix(in oklab, var(--wall) 85%, white) calc(var(--panel) * 100%), transparent),
          color-mix(in oklab, var(--wall-deep) calc(var(--panel) * 100%), transparent));
      box-shadow:
        0 40px 120px rgb(0 0 0 / calc(var(--panel) * .6)),
        inset 0 0 0 1px color-mix(in oklab, var(--ink) calc(var(--panel) * 14%), transparent);
      overflow: auto;
    }
    /* While a book flies in from (or back to) the shelf it travels outside the panel. */
    dialog.flying { overflow: visible; }
    dialog.flying .stage::after { opacity: 0; }
    dialog .info, dialog .close, dialog .stage::after { transition: opacity .3s ease; }
    dialog.arriving { animation: panel-in .45s ease both; }
    dialog.arriving .info, dialog.arriving .close { animation: fade-in .4s .3s ease both; }
    dialog.leaving { animation: panel-out .35s ease .15s both; }
    dialog.leaving .info, dialog.leaving .close { opacity: 0; transition-duration: .18s; }
    dialog.arriving::backdrop { animation: fade-in .45s ease both; }
    dialog.leaving::backdrop { animation: fade-in .45s ease reverse both; }
    @keyframes panel-in { from { --panel: 0; } }
    @keyframes panel-out { to { --panel: 0; } }
    @keyframes fade-in { from { opacity: 0; } }
    /* The book's slot on the shelf stays empty while it's off the shelf. */
    .book.away { visibility: hidden; }
    dialog:focus-visible { outline: none; }
    dialog::backdrop { background: color-mix(in oklab, var(--wall-deep) 78%, transparent); }
    .detail {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
      gap: 24px;
      padding: 28px;
    }
    .stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 440px;
      perspective: 1400px;
      cursor: grab;
      touch-action: pan-y;
    }
    .stage:active { cursor: grabbing; }
    .stage::after {
      content: "";
      position: absolute;
      left: 12%; right: 12%; bottom: 18px;
      height: 40px;
      background: radial-gradient(closest-side, rgb(0 0 0 / .5), transparent);
      pointer-events: none;
    }
    /* The book in hand, cover facing you: x runs across the cover from the spine,
       z is its thickness. --cw/--ch size the cover, --t the thickness. */
    .big-book {
      --cw: 200px;
      --ch: 300px;
      --t: 40px;
      position: relative;
      z-index: 1;
      width: var(--cw);
      height: var(--ch);
      transform-style: preserve-3d;
      transform: rotateX(8deg) rotateY(var(--spin, 0deg));
    }
    .big-book.turning { transition: transform 1.1s cubic-bezier(.2, .75, .15, 1); }
    .big-book .bf { position: absolute; backface-visibility: hidden; }
    .big-book .b-cover {
      inset: 0;
      transform: translateZ(calc(var(--t) / 2));
      border-radius: 1px 3px 3px 1px;
      background: var(--bg) center / cover no-repeat;
    }
    .big-book .b-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgb(0 0 0 / .4), rgb(255 255 255 / .16) 2.5%, rgb(0 0 0 / .1) 5%, transparent 10%, transparent 80%, rgb(0 0 0 / .12));
    }
    .big-book .b-back {
      inset: 0;
      overflow: hidden;
      transform: translateZ(calc(var(--t) / -2)) rotateY(180deg);
      background: var(--bg) center / cover no-repeat;
    }
    .big-book .b-back::before {
      /* Wraparound art: the front cover, knocked back. */
      content: "";
      position: absolute;
      inset: -20px;
      background: inherit;
      filter: blur(10px) brightness(.45) saturate(.9);
    }
    .big-book .b-spine {
      top: 0;
      left: calc(var(--t) / -2);
      width: var(--t);
      height: 100%;
      transform: rotateY(-90deg);
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--bg);
    }
    .big-book .b-spine::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgb(0 0 0 / .4), rgb(255 255 255 / .12) 25%, rgb(0 0 0 / 0) 55%, rgb(0 0 0 / .35));
    }
    .big-book .b-spine span {
      writing-mode: vertical-rl;
      font-size: clamp(11px, calc(var(--t) * .42), 20px);
      font-weight: 750;
      font-variation-settings: "wdth" 70;
      white-space: nowrap;
      max-height: 92%;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--fg);
    }
    .big-book .b-edge {
      /* Fore-edge: the stacked page ends opposite the spine. */
      top: 3px;
      height: calc(100% - 6px);
      left: calc(var(--cw) - var(--t) / 2 - 5px);
      width: calc(var(--t) - 2px);
      transform: rotateY(90deg);
      background: repeating-linear-gradient(90deg, #efe5cd 0 1px, #d8caa9 1px 2px);
    }
    .big-book .b-top, .big-book .b-bottom {
      left: 1px;
      width: calc(100% - 6px);
      height: calc(var(--t) - 2px);
      background: repeating-linear-gradient(0deg, #efe5cd 0 1px, #d8caa9 1px 2px);
    }
    .big-book .b-top { top: calc(var(--t) / -2 + 1px); transform: rotateX(90deg); }
    .big-book .b-bottom { top: calc(var(--ch) - var(--t) / 2 + 1px); transform: rotateX(-90deg); filter: brightness(.6); }
    .made-cover {
      position: absolute;
      inset: 0;
      padding: 26px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--fg);
    }
    .made-cover b {
      font-size: 30px;
      line-height: .95;
      font-weight: 850;
      font-variation-settings: "wdth" 120;
      letter-spacing: -.02em;
      overflow-wrap: anywhere;
    }
    .made-cover i { font-style: normal; font-size: 15px; font-variation-settings: "wdth" 80; opacity: .8; }

    .info { display: flex; flex-direction: column; padding: 12px 4px 4px; min-width: 0; }
    .info h2 {
      margin: 0;
      padding-right: 72px;
      font-size: clamp(30px, 4.2vw, 46px);
      line-height: .98;
      font-weight: 800;
      font-variation-settings: "wdth" 115;
      letter-spacing: -.025em;
      overflow-wrap: break-word;
    }
    .info .sub { margin: 10px 0 0; font-size: 18px; line-height: 1.35; color: var(--ink-dim); }
    .info .by { margin: 16px 0 0; font-size: 19px; }
    .rating { margin-top: 30px; }
    .meter { display: flex; gap: 5px; }
    .meter[hidden], .also[hidden], .sub[hidden] { display: none; }
    .meter i {
      position: relative;
      width: 36px;
      height: 10px;
      border-radius: 2px;
      overflow: hidden;
      background: color-mix(in oklab, var(--ink) 14%, transparent);
    }
    .meter i::after {
      content: "";
      position: absolute;
      inset: 0;
      width: calc(var(--f) * 100%);
      background: var(--glow);
      box-shadow: 0 0 12px var(--glow);
    }
    .rating p { margin: 10px 0 0; font-size: 16px; color: var(--ink-dim); }
    .facts { margin: 22px 0 0; font-size: 16px; line-height: 1.7; color: var(--ink-dim); }
    .facts a { color: var(--ink); }
    .also { margin-top: 26px; }
    .also h3 { margin: 0 0 12px; font-size: 15px; font-weight: 550; color: var(--ink-dim); }
    .also div {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 4px 10px;
      scrollbar-width: thin;
    }
    .also button {
      position: relative;
      flex: none;
      width: 58px;
      height: 88px;
      padding: 0;
      border: 0;
      border-radius: 2px;
      background: none;
      cursor: pointer;
      transition: transform .2s;
    }
    .also button:hover { transform: translateY(-4px); }
    .also .front { box-shadow: 0 0 calc(var(--g) * 14px) color-mix(in oklab, var(--glow) calc(var(--g) * 70%), transparent), 0 6px 12px -4px rgb(0 0 0 / .6); }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: auto;
      padding-top: 28px;
    }
    .nav button, .close {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 9px 16px;
      font: inherit;
      font-size: 15px;
      font-weight: 550;
      color: var(--ink);
      background: color-mix(in oklab, var(--wall-deep) 65%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--ink) 20%, transparent);
      cursor: pointer;
    }
    .nav button:hover, .close:hover { background: color-mix(in oklab, var(--ink) 16%, transparent); }
    .close { position: absolute; top: 16px; right: 16px; z-index: 2; }

    @media (max-width: 720px) {
      :root { --shelf-h: 150px; }
      header { padding: 32px 16px 0; }
      main { padding: 28px 8px 24px; }
      .books { padding: 0 8px; }
      .label { left: 8px; }
      .search { width: 100%; }
      .controls { width: 100%; }
      .detail { grid-template-columns: 1fr; padding: 20px 18px 22px; gap: 4px; }
      .stage { min-height: 300px; margin-bottom: 14px; }

      .info { padding-top: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="room" id="room" aria-hidden="true"></div>
  <div class="ceiling" id="ceiling" aria-hidden="true"></div>
  <header>
    <h1>Tristan Homsi<span>has read these.</span></h1>
    <div class="intro">
      <p id="summary">Loading the shelf.</p>
      <div class="controls">
        <div class="toggle" role="group" aria-label="Show books as">
          <button type="button" data-view="spines" aria-pressed="true">Spines</button>
          <button type="button" data-view="covers" aria-pressed="false">Covers</button>
        </div>
        <div class="toggle" role="group" aria-label="Order books by">
          <button type="button" data-mode="author" aria-pressed="true">By author</button>
          <button type="button" data-mode="rating" aria-pressed="false">By rating</button>
        </div>
        <input class="search" type="search" placeholder="Find a book or author" aria-label="Find a book or author">
      </div>
    </div>
  </header>

  <main id="shelves" aria-label="Bookshelf"></main>
  <p class="empty" id="empty"></p>

  <div class="floor" id="floor" aria-hidden="true"></div>
  <dialog id="detail" aria-labelledby="d-title" tabindex="-1">
    <button class="close" type="button" data-close>Close</button>
    <div class="detail">
      <div class="stage" id="stage">
        <div class="big-book" id="big"></div>
      </div>
      <div class="info">
        <h2 id="d-title"></h2>
        <p class="sub" id="d-sub"></p>
        <p class="by" id="d-by"></p>
        <div class="rating">
          <div class="meter" id="d-meter" aria-hidden="true"></div>
          <p id="d-rating"></p>
        </div>
        <p class="facts" id="d-facts"></p>
        <section class="also" id="d-also" hidden>
          <h3></h3>
          <div></div>
        </section>
        <div class="nav">
          <button type="button" data-step="-1">Previous book</button>
          <button type="button" data-step="1">Next book</button>
        </div>
      </div>
    </div>
  </dialog>

  <script>
  (() => {
    const DEFAULT_SEED = "5e2673022e83f0b49727427fb41ef1c3ef11a9707f6dbfa2607661b64c1b3765";
    const params = new URLSearchParams(location.search);
    const SEED = /^[0-9a-f]{64}$/i.test(params.get("seed") || "") ? params.get("seed").toLowerCase() : DEFAULT_SEED;
    const chunks = Array.from({ length: 10 }, (_, i) => "#" + SEED.slice(i * 6, i * 6 + 6));
    const bytes = SEED.match(/../g).map(h => parseInt(h, 16));
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const canHover = matchMedia("(hover: hover)").matches;
    const root = document.documentElement;

    // ---------- Color helpers ----------
    function rgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [n >> 16 & 255, n >> 8 & 255, n & 255];
    }
    function hsl(hex) {
      let [r, g, b] = rgb(hex).map(v => v / 255);
      const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
      const l = (max + min) / 2;
      const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
      let h = 0;
      if (d) h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      return [(h * 60 + 360) % 360, s, l];
    }
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const css = (h, s, l) => `hsl(${h.toFixed(1)} ${(s * 100).toFixed(1)}% ${(l * 100).toFixed(1)}%)`;
    function luminance(hex) {
      const [r, g, b] = rgb(hex).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; });
      return .2126 * r + .7152 * g + .0722 * b;
    }

    // ---------- Palette and camera from the seed ----------
    // Chunk 6 is the plaster wall, 9 the wood of the shelves and floor, 2 the lettering and
    // the lamplight that ratings cast. Hues come straight from the seed, pulled toward warm,
    // lived-in ranges; lightness is clamped so any seed stays legible.
    const [wh, ws, wl] = hsl(chunks[6]);
    const ph = 15 + hsl(chunks[9])[0] % 25;
    const [ih, is] = hsl(chunks[2]);
    const gh = clamp(hsl(chunks[2])[0] + 14, 28, 44);
    const wallL = clamp(wl, .33, .37), wallS = clamp(ws, .18, .32);
    const plankL = .3, plankS = .42;
    Object.entries({
      "--wall": css(wh, wallS, wallL),
      "--wall-deep": css(wh, clamp(wallS + .04, 0, .5), wallL * .55),
      "--plank": css(ph, plankS, plankL),
      "--plank-top": css(ph + 4, plankS * .9, plankL + .16),
      "--plank-dark": css(ph, plankS, plankL * .45),
      "--floor": css(ph, .32, .22),
      "--ink": css(ih + 10, clamp(is, .35, .8), .93),
      "--ink-dim": css(ih + 10, clamp(is * .5, .15, .4), .8),
      "--glow": css(gh, .95, .62),
      "--tilt-x": `${-(7 + bytes[30] / 255 * 6).toFixed(2)}deg`,
      "--tilt-y": `${(bytes[31] / 255 * 6 - 3).toFixed(2)}deg`,
    }).forEach(([k, v]) => root.style.setProperty(k, v));
    document.querySelector('meta[name="theme-color"]').content = css(wh, wallS, wallL * .55);
    // The other six chunks dress books that have no cover image.
    const spareColors = [3, 4, 6, 7, 8, 9].map(i => chunks[i]);

    function rng(str) {
      let h = 1779033703 ^ str.length;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = h << 13 | h >>> 19;
      }
      return () => {
        h = Math.imul(h ^ h >>> 16, 2246822507);
        h = Math.imul(h ^ h >>> 13, 3266489909);
        return ((h ^= h >>> 16) >>> 0) / 4294967296;
      };
    }

    // ---------- Plants ----------
    // Every leaf is drawn here from the seed: same seed, same plants.
    // Leaves take their hues from chunks 5, 7 and 8, nudged into warm, leafy greens.
    const leafHues = [5, 7, 8].map(i => clamp(hsl(chunks[i])[0], 75, 135));
    const potTones = [2, 6, 7, 3].map(i => hsl(chunks[i]));
    const n1 = v => v.toFixed(1);
    // Drawn as an <img>: one node to style and lay out, rasterized once.
    const HALF = `<defs><clipPath id="half"><rect x="-4000" y="-4000" width="4000" height="8000"/></clipPath></defs>`;
    function svgImage(markup, x, y, w, h) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${n1(w)}" height="${n1(h)}" viewBox="${n1(x)} ${n1(y)} ${n1(w)} ${n1(h)}">${HALF}${markup}</svg>`;
      return `<img alt="" decoding="async" width="${Math.round(w)}" height="${Math.round(h)}" src="data:image/svg+xml,${encodeURIComponent(svg)}">`;
    }
    const pick = (rand, list) => list[Math.floor(rand() * list.length)];

    // Background plants pass a lower `sat` so they sit back behind the shelf.
    let roomSat = 1;
    function leafTone(rand, light) {
      const h = pick(rand, leafHues) + rand() * 12 - 6, s = (.34 + rand() * .26) * roomSat, l = light + rand() * .07;
      return { base: css(h, s, l), lit: css(h - 5, s + .06, l + .09), vein: css(h - 10, s * .7, l + .24) };
    }

    // Leaf outlines, drawn with the stem at 0,0 and the tip at 0,-L.
    function heartLeaf(L, W) {
      return `M0 0C${n1(W * .35)} ${n1(L * .12)} ${n1(W * 1.1)} ${n1(L * .02)} ${n1(W * .95)} ${n1(-L * .32)}` +
        `C${n1(W * .8)} ${n1(-L * .65)} ${n1(W * .25)} ${n1(-L * .85)} 0 ${n1(-L)}` +
        `C${n1(-W * .25)} ${n1(-L * .85)} ${n1(-W * .8)} ${n1(-L * .65)} ${n1(-W * .95)} ${n1(-L * .32)}` +
        `C${n1(-W * 1.1)} ${n1(L * .02)} ${n1(-W * .35)} ${n1(L * .12)} 0 0Z`;
    }
    function bladeLeaf(L, W) {
      return `M0 0C${n1(W * .9)} ${n1(-L * .08)} ${n1(W * 1.05)} ${n1(-L * .62)} 0 ${n1(-L)}` +
        `C${n1(-W * 1.05)} ${n1(-L * .62)} ${n1(-W * .9)} ${n1(-L * .08)} 0 0Z`;
    }
    function smoothPath(pts) {
      let d = `M${n1(pts[0][0])} ${n1(pts[0][1])}`;
      for (let i = 1; i < pts.length - 1; i++) {
        const [x, y] = pts[i], [nx, ny] = pts[i + 1];
        d += `Q${n1(x)} ${n1(y)} ${n1((x + nx) / 2)} ${n1((y + ny) / 2)}`;
      }
      return d + "Z";
    }
    function monsteraLeaf(L, rand) {
      // Heart outline traced around a center point, with slits cut toward the midrib
      // and a few holes punched beside it (even-odd fill).
      const cy = -.3 * L;
      const r = p => L * (.3 + .4 * p ** 1.4 + .28 * Math.sin(Math.PI * p) ** .8);
      const at = (p, k = 1) => { const a = Math.PI * p, rr = r(p) * k; return [rr * Math.sin(a), cy + rr * Math.cos(a)]; };
      const slits = Array.from({ length: 3 + Math.floor(rand() * 4) }, (_, k) => .16 + (k + .3 + rand() * .4) * .7 / 6);
      const right = [];
      const N = 34;
      for (let i = 0; i <= N; i++) {
        const p = i / N;
        right.push(at(p));
        for (const s of slits) if (s >= p && s < p + 1 / N) right.push(at(s, .14 + rand() * .12), at(s + .014));
      }
      const pts = [...right, ...right.slice(1, -1).reverse().map(([x, y]) => [-x, y])];
      let d = smoothPath(pts);
      for (const s of slits) {
        if (rand() < .45) continue;
        const [hx, hy] = at(s + .05, .42);
        const rx = L * .03 + rand() * L * .02, ry = rx * 1.8;
        for (const x of [hx, -hx]) d += `M${n1(x - rx)} ${n1(hy)}a${n1(rx)} ${n1(ry)} 0 1 0 ${n1(rx * 2)} 0a${n1(rx)} ${n1(ry)} 0 1 0 ${n1(-rx * 2)} 0Z`;
      }
      return d;
    }

    // One leaf: the lamp-side half a shade lighter than the other, plus a soft midrib.
    function leafGroup(x, y, angle, d, tone, vein, flip = 1) {
      return `<g transform="translate(${n1(x)} ${n1(y)}) rotate(${n1(angle)}) scale(${flip} 1)">` +
        `<path d="${d}" fill="${tone.base}" fill-rule="evenodd"/>` +
        (tone.lit ? `<path d="${d}" fill="${tone.lit}" fill-rule="evenodd" clip-path="url(#half)"/>` : "") +
        (vein ? `<path d="${vein}" fill="none" stroke="${tone.vein}" stroke-opacity=".45" stroke-width="1.1"/>` : "") + `</g>`;
    }
    const midrib = L => `M0 0Q${n1(L * .04)} ${n1(-L * .5)} 0 ${n1(-L * .95)}`;

    function monsteraClump(x, y, height, rand, light, count = 6) {
      let stems = "", leaves = "";
      for (let i = 0; i < count; i++) {
        const lean = (rand() - .5) * 110 + (i % 2 ? 12 : -12);
        const len = height * (.45 + rand() * .5);
        const a = lean * Math.PI / 180;
        const ex = x + Math.sin(a) * len, ey = y - Math.cos(a) * len;
        stems += `M${n1(x)} ${n1(y)}Q${n1(x + Math.sin(a) * len * .2)} ${n1(y - len * .7)} ${n1(ex)} ${n1(ey)}`;
        const L = height * (.22 + rand() * .14);
        leaves += leafGroup(ex, ey, lean * .8 + (rand() - .5) * 30, monsteraLeaf(L, rand), leafTone(rand, light), midrib(L), rand() < .5 ? -1 : 1);
      }
      return `<path d="${stems}" fill="none" stroke="${leafTone(rand, light).base}" stroke-width="${n1(height * .012 + 1)}" stroke-linecap="round"/>` + leaves;
    }

    function fernClump(x, y, height, rand, light, count = 7) {
      let out = "";
      for (let i = 0; i < count; i++) {
        const side = i % 2 ? 1 : -1;
        const len = height * (.55 + rand() * .45);
        const spread = (.15 + rand() * .55) * side;
        // Arching frond: rises, then droops at the tip.
        const p0 = [x, y], p1 = [x + spread * len * .5, y - len * .95], p2 = [x + spread * len * 1.05, y - len * (.35 + rand() * .3)];
        const bez = t => [(1 - t) ** 2 * p0[0] + 2 * (1 - t) * t * p1[0] + t * t * p2[0], (1 - t) ** 2 * p0[1] + 2 * (1 - t) * t * p1[1] + t * t * p2[1]];
        const lit = [], shade = [];
        for (let t = .12; t < .98; t += .035) {
          const [bx, by] = bez(t), [nx, ny] = bez(t + .01);
          const ang = Math.atan2(ny - by, nx - bx);
          const size = len * .16 * Math.sin(Math.PI * Math.min(1, t * 1.15)) + 3;
          for (const s of [-1, 1]) {
            const a = ang + s * 1.15;
            const tx = bx + Math.cos(a) * size, ty = by + Math.sin(a) * size;
            const w = size * .22, px = -Math.sin(a) * w, py = Math.cos(a) * w;
            const mx = bx + Math.cos(a) * size * .45, my = by + Math.sin(a) * size * .45;
            // Leaflets facing up catch the lamp; the ones facing down sit in shade.
            (ty < by ? lit : shade).push(`M${n1(bx)} ${n1(by)}Q${n1(mx + px)} ${n1(my + py)} ${n1(tx)} ${n1(ty)}Q${n1(mx - px)} ${n1(my - py)} ${n1(bx)} ${n1(by)}Z`);
          }
        }
        const tone = leafTone(rand, light);
        out += `<path d="M${n1(p0[0])} ${n1(p0[1])}Q${n1(p1[0])} ${n1(p1[1])} ${n1(p2[0])} ${n1(p2[1])}" fill="none" stroke="${tone.base}" stroke-width="1.6"/>` +
          `<path d="${shade.join("")}" fill="${tone.base}"/><path d="${lit.join("")}" fill="${tone.lit}"/>`;
      }
      return out;
    }

    function vine(x, y, length, rand, light, drift = 0) {
      // A pothos strand falling from x,y.
      const amp = 6 + rand() * 10, period = 30 + rand() * 30, phase = rand() * 6;
      const pt = t => [x + amp * Math.sin(t / period + phase) + drift * t, y + t];
      let stem = `M${n1(x)} ${n1(y)}`;
      for (let t = 4; t <= length; t += 4) { const [px, py] = pt(t); stem += `L${n1(px)} ${n1(py)}`; }
      let leaves = "", side = rand() < .5 ? 1 : -1;
      for (let t = 10 + rand() * 8; t < length; t += 13 + rand() * 8) {
        const [px, py] = pt(t);
        const L = 13 + rand() * 11 * (1 - t / length * .4);
        leaves += leafGroup(px, py, 180 + side * (30 + rand() * 45), heartLeaf(L, L * .62), leafTone(rand, light + .04), `M0 0L0 ${n1(-L * .9)}`);
        side = -side;
      }
      return `<path d="${stem}" fill="none" stroke="${leafTone(rand, light - .02).base}" stroke-width="1.3"/>` + leaves;
    }

    // Pots: glazed belly pots, plain clay, and woven baskets.
    function pot(cx, base, w, h, rand) {
      const kind = pick(rand, ["belly", "clay", "basket"]);
      if (kind === "basket") {
        const body = css(34, .38, .5 + rand() * .08), bw = w * .86;
        let weave = "";
        for (let y = base - h + 5; y < base - 2; y += 5) {
          const off = ((y - base) / 5) % 2 ? 0 : 3;
          weave += `<path d="M${n1(cx - w / 2 + 2)} ${n1(y)}L${n1(cx + w / 2 - 2)} ${n1(y)}" stroke="rgb(60 35 10 / .28)" stroke-width="1.6" stroke-dasharray="3 3" stroke-dashoffset="${off}"/>`;
        }
        return `<path d="M${n1(cx - w / 2)} ${n1(base - h)}L${n1(cx + w / 2)} ${n1(base - h)}L${n1(cx + bw / 2)} ${n1(base)}L${n1(cx - bw / 2)} ${n1(base)}Z" fill="${body}"/>` + weave +
          `<rect x="${n1(cx - w / 2 - 1)}" y="${n1(base - h - 2)}" width="${n1(w + 2)}" height="5" rx="2.5" fill="${css(32, .4, .42)}"/>` +
          `<path d="M${n1(cx + w * .08)} ${n1(base - h)}L${n1(cx + w / 2)} ${n1(base - h)}L${n1(cx + bw / 2)} ${n1(base)}L${n1(cx + bw * .08)} ${n1(base)}Z" fill="rgb(40 20 0 / .16)"/>`;
      }
      const [ph2, ps2, pl2] = pick(rand, potTones);
      const body = css(ph2, clamp(ps2, .12, .38) * roomSat, clamp(pl2, .52, .7));
      if (kind === "belly") {
        const t = base - h;
        return `<path d="M${n1(cx - w * .42)} ${n1(t)}C${n1(cx - w * .62)} ${n1(t + h * .45)} ${n1(cx - w * .5)} ${n1(base)} ${n1(cx - w * .28)} ${n1(base)}L${n1(cx + w * .28)} ${n1(base)}C${n1(cx + w * .5)} ${n1(base)} ${n1(cx + w * .62)} ${n1(t + h * .45)} ${n1(cx + w * .42)} ${n1(t)}Z" fill="${body}"/>` +
          `<path d="M${n1(cx + w * .1)} ${n1(t)}L${n1(cx + w * .42)} ${n1(t)}C${n1(cx + w * .62)} ${n1(t + h * .45)} ${n1(cx + w * .5)} ${n1(base)} ${n1(cx + w * .28)} ${n1(base)}L${n1(cx + w * .1)} ${n1(base)}Z" fill="rgb(0 0 0 / .14)"/>` +
          `<ellipse cx="${n1(cx - w * .22)}" cy="${n1(t + h * .38)}" rx="${n1(w * .06)}" ry="${n1(h * .2)}" fill="rgb(255 255 255 / .22)"/>` +
          `<rect x="${n1(cx - w * .45)}" y="${n1(t - 3)}" width="${n1(w * .9)}" height="5" rx="2.5" fill="${body}"/>`;
      }
      const rimH = h * .18, bw = w * .76;
      return `<path d="M${n1(cx - w / 2)} ${n1(base - h + rimH)}L${n1(cx + w / 2)} ${n1(base - h + rimH)}L${n1(cx + bw / 2)} ${n1(base)}L${n1(cx - bw / 2)} ${n1(base)}Z" fill="${body}"/>` +
        `<path d="M${n1(cx + w * .05)} ${n1(base - h + rimH)}L${n1(cx + w / 2)} ${n1(base - h + rimH)}L${n1(cx + bw / 2)} ${n1(base)}L${n1(cx + bw * .05)} ${n1(base)}Z" fill="rgb(0 0 0 / .16)"/>` +
        `<rect x="${n1(cx - w / 2 - 2)}" y="${n1(base - h)}" width="${n1(w + 4)}" height="${n1(rimH)}" rx="1.5" fill="${body}"/>` +
        `<rect x="${n1(cx - w / 2 - 2)}" y="${n1(base - h + rimH - 2)}" width="${n1(w + 4)}" height="2" fill="rgb(0 0 0 / .2)"/>`;
    }

    function snakePlant(cx, base, h, rand) {
      let out = "";
      const edge = css(leafHues[0] - 15, .65, .66);
      const n = 5 + Math.floor(rand() * 3);
      for (let i = 0; i < n; i++) {
        const L = h * (.55 + rand() * .45), W = 6 + rand() * 4;
        const x = cx + (i - n / 2) * 5 + rand() * 4;
        const tone = leafTone(rand, .26);
        out += `<g transform="translate(${n1(x)} ${n1(base)}) rotate(${n1((i - n / 2) * 5 + (rand() - .5) * 8)})">` +
          `<path d="${bladeLeaf(L, W)}" fill="${tone.base}" stroke="${edge}" stroke-width="1.4"/>` +
          `<path d="${bladeLeaf(L, W)}" fill="${tone.lit}" clip-path="url(#half)"/>` +
          `<path d="M0 ${n1(-L * .2)}L0 ${n1(-L * .8)}" stroke="rgb(255 255 255 / .12)" stroke-width="${n1(W * .5)}" stroke-dasharray="3 7"/></g>`;
      }
      return out;
    }

    function pilea(cx, base, h, rand) {
      let stems = "", coins = "";
      const n = 9 + Math.floor(rand() * 6);
      for (let i = 0; i < n; i++) {
        const a = (-80 + 160 * (i + rand() * .6) / n) * Math.PI / 180;
        const len = h * (.45 + rand() * .5);
        const ex = cx + Math.sin(a) * len * .8, ey = base - Math.cos(a) * len;
        stems += `M${n1(cx)} ${n1(base)}Q${n1(cx + Math.sin(a) * len * .2)} ${n1(base - len * .6)} ${n1(ex)} ${n1(ey)}`;
        const r = 5 + rand() * 6, tone = leafTone(rand, .36);
        coins += `<circle cx="${n1(ex)}" cy="${n1(ey)}" r="${n1(r)}" fill="${tone.base}"/><circle cx="${n1(ex - r * .2)}" cy="${n1(ey - r * .2)}" r="${n1(r * .7)}" fill="${tone.lit}"/><circle cx="${n1(ex)}" cy="${n1(ey)}" r="1.2" fill="${tone.vein}"/>`;
      }
      return `<path d="${stems}" fill="none" stroke="${leafTone(rand, .32).base}" stroke-width="1.2"/>` + coins;
    }

    function vineCrown(cx, top, w, rand) {
      let out = "";
      for (let i = 0; i < 7; i++) {
        const x = cx + (rand() - .5) * w, L = 14 + rand() * 9;
        out += leafGroup(x, top + 2, (rand() - .5) * 120, heartLeaf(L, L * .62), leafTone(rand, .32), `M0 0L0 ${n1(-L * .9)}`);
      }
      return out;
    }

    // A potted plant sized to sit in the slack at the end of a shelf.
    function shelfPlant(rand, w, shelfH) {
      const el = document.createElement("div");
      el.className = "plant";
      el.style.width = w + "px";
      el.style.height = shelfH + "px";
      const cx = w / 2, base = shelfH;
      const potW = Math.min(w * .62, 64), potH = potW * .82;
      const kind = pick(rand, ["snake", "pilea", "trailing", "trailing", "monstera"]);
      let leaves = "";
      if (kind === "snake") leaves = snakePlant(cx, base - potH + 4, shelfH - potH - 4, rand);
      else if (kind === "pilea") leaves = pilea(cx, base - potH + 4, (shelfH - potH) * .9, rand);
      else if (kind === "monstera") leaves = monsteraClump(cx, base - potH + 4, shelfH - potH, rand, .3, 4);
      else {
        // Pothos spilling over the pot and down past the front of the plank.
        for (let i = 0; i < 4; i++) {
          const sx = cx + (rand() - .5) * potW * .8;
          leaves += vine(sx, base - potH, potH + 30 + rand() * shelfH * .55, rand, .28, (sx - cx) * .004 + (rand() - .5) * .08);
        }
        leaves += vineCrown(cx, base - potH, potW, rand);
      }
      const potSvg = pot(cx, base, potW, potH, rand);
      // Canvas runs past the plant's box so leaves can spread and vines can hang over the plank.
      const padX = 70, below = shelfH * .8;
      el.innerHTML = svgImage(kind === "trailing" ? potSvg + leaves : leaves + potSvg, -padX, 0, w + padX * 2, shelfH + below);
      el.firstChild.style.left = -padX + "px";
      return el;
    }

    function hangingPlanter(x, drop, rand, reach = 1) {
      // A pot slung from the ceiling on three cords, pothos tumbling out of it.
      const w = 58 * Math.min(1, reach + .3), h = 46 * Math.min(1, reach + .3), top = drop - h;
      let out = `<path d="M${n1(x)} 0L${n1(x - w * .45)} ${n1(top)}M${n1(x)} 0L${n1(x + w * .45)} ${n1(top)}M${n1(x)} 0L${n1(x + w * .05)} ${n1(top)}" stroke="${css(34, .3, .62)}" stroke-width="1.2"/>`;
      let vines = "";
      for (let i = 0; i < 5; i++) {
        const sx = x + (rand() - .5) * w * .8;
        vines += vine(sx, top, (120 + rand() * 260) * reach, rand, .3, (sx - x) * .003);
      }
      return out + pot(x, drop, w, h, rand) + vines + vineCrown(x, top, w, rand);
    }

    // The room is part of the page, not the screen: a ceiling with a hanging planter and the
    // window's leaf shadows at the top, and the floor with standing plants at the very bottom.
    // Only the plain wall stays fixed behind everything.
    function buildRoom() {
      const W = document.documentElement.clientWidth;
      const rand = rng(SEED + "room");
      const margin = Math.max(0, (W - 1240) / 2);
      const compact = W < 720;
      const [wh2, ws2] = hsl(chunks[6]);

      // Ceiling: one screen tall, scrolls away with the header.
      const H = Math.min(innerHeight, 820);
      const top = [];
      top.push(`<defs><linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(42 100% 80%)" stop-opacity=".12"/><stop offset=".75" stop-color="hsl(42 100% 80%)" stop-opacity="0"/></linearGradient></defs>`);
      top.push(`<path d="M${n1(W * .02)} 0L${n1(W * .5)} 0L${n1(W * .9)} ${H}L${n1(W * .36)} ${H}Z" fill="url(#sun)"/>`);
      let shadows = "";
      const shadowTone = { base: css(wh2 - 20, clamp(ws2, .2, .4), .1) };
      for (let i = 0; i < 3; i++) {
        const L = Math.min(W, H) * (.22 + rand() * .12);
        shadows += leafGroup(W * (.45 + rand() * .4), H * (.3 + rand() * .4), -30 + rand() * 80, monsteraLeaf(L, rand), shadowTone);
      }
      top.push(`<g opacity=".06" transform="skewX(-14)">${shadows}</g>`);
      roomSat = .38;
      if (!compact && margin > 60) top.push(`<g opacity=".6">${hangingPlanter(margin * .45, H * .1, rand, .75)}</g>`);
      document.getElementById("ceiling").innerHTML = svgImage(top.join(""), 0, 0, W, H);

      // Floor: below the last shelf, plants standing on floorboards either side.
      // Tall enough that the highest leaf clears the top of the canvas.
      const plantH = compact ? 190 : 330;
      const F = Math.round(plantH * 1.25 + (compact ? 120 : 150)), floorY = F - (compact ? 44 : 64);
      const bottom = [];
      let boards = "";
      for (let x = -40 + rand() * 40; x < W; x += 90 + rand() * 60) boards += `M${n1(x)} ${n1(floorY)}L${n1(x - 30)} ${F}`;
      bottom.push(`<rect x="0" y="${n1(floorY)}" width="${W}" height="${n1(F - floorY)}" fill="${css(ph, .32, .22)}"/>` +
        `<rect x="0" y="${n1(floorY)}" width="${W}" height="3" fill="${css(ph, .28, .3)}"/>` +
        `<path d="${boards}" stroke="rgb(0 0 0 / .22)" stroke-width="1.5"/>`);
      const potScale = compact ? .6 : 1;
      const leftX = compact ? 46 : Math.max(110, margin + 60), rightX = compact ? W - 46 : Math.min(W - 110, W - margin - 60);
      const plants = monsteraClump(leftX, floorY - 70 * potScale, plantH, rand, .27, compact ? 5 : 8) + pot(leftX, floorY + 6, 140 * potScale, 92 * potScale, rand) +
        fernClump(rightX, floorY - 70 * potScale, plantH * .8, rand, .29, compact ? 6 : 8) + pot(rightX, floorY + 6, 120 * potScale, 86 * potScale, rand);
      bottom.push(`<g opacity=".75">${plants}</g>`);
      roomSat = 1;
      document.getElementById("floor").innerHTML = svgImage(bottom.join(""), 0, 0, W, F);
    }

    // ---------- Book geometry ----------
    function spineColor(colors) {
      // Dominant cover color, unless it's flat black/white and a livelier color is close behind.
      const [first, ...rest] = colors;
      const [, , l] = hsl(first);
      if (l < .07 || l > .93) {
        const alt = rest.find(c => { const [, s, l2] = hsl(c); return s > .22 && l2 > .14 && l2 < .82; });
        if (alt) return alt;
      }
      return first;
    }
    function inkFor(bg) {
      const [h, s] = hsl(bg);
      return luminance(bg) > .32 ? css(h, Math.min(s, .5), .1) : css(h, Math.min(s, .35), .92);
    }

    const fracs = { .25: "¼", .5: "½", .75: "¾" };
    const fmtRating = r => Math.floor(r) + (fracs[r % 1] || "");
    const glowOf = r => r == null ? 0 : clamp((r - 3.5) / 1.5, 0, 1);

    function decorate(book) {
      const rand = rng(SEED + book.id);
      const hasCover = !!book.c;
      book.bg = hasCover ? spineColor(book.c) : spareColors[Math.floor(rand() * spareColors.length)];
      book.accent = hasCover ? (book.c.find(c => c !== book.bg) || book.c[0]) : chunks[2];
      book.fg = inkFor(book.bg);
      const pages = book.p || 260 + rand() * 380;
      book.thick = clamp(14 + pages * .03, 18, 54);
      book.height = .8 + rand() * .19;
      book.weight = Math.round(520 + rand() * 330);
      book.variant = Math.floor(rand() * 4);
      book.rot = (rand() * 10 - 5).toFixed(1) + "deg";
      book.ar = book.ar || .66;
    }

    // ---------- Render ----------
    const shelves = document.getElementById("shelves");
    let books = [];
    let order = [];
    let mode = "author";
    let view = "spines";

    function bookEl(book) {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "book";
      el.dataset.id = book.id;
      const label = [book.t + (book.a ? ` by ${book.a}` : "")];
      label.push(book.r != null ? `rated ${book.r} out of 5` : "not rated");
      el.setAttribute("aria-label", label.join(", "));
      el.style.cssText = `--bg:${book.bg};--fg:${book.fg};--accent:${book.accent};--g:${glowOf(book.r).toFixed(2)};--rot:${book.rot}`;
      el.addEventListener("pointerenter", () => ensureFace(el, book));
      el.addEventListener("focus", () => ensureFace(el, book));
      el.addEventListener("click", () => openDetail(book.id, true));
      book.el = el;
      return el;
    }

    // Top-rated books stand face-out on the spine shelf, like a shop's picks.
    const isOut = book => view === "covers" || (book.r != null && book.r >= 4.75);

    function fill(book) {
      const el = book.el;
      book.out = isOut(book);
      el.classList.toggle("out", book.out);
      const lift = document.createElement("span");
      lift.className = "lift";
      lift.append(book.out ? frontEl(book) : spineEl(book));
      el.replaceChildren(lift);
    }

    function coverImg(book, lazy) {
      const img = document.createElement("img");
      img.alt = "";
      img.decoding = "async";
      if (lazy) img.loading = "lazy";
      img.onload = () => img.classList.add("ready");
      img.src = `covers/${book.id}.webp`;
      if (img.complete) img.classList.add("ready");  // already cached: no fade
      return img;
    }

    function frontEl(book) {
      const front = document.createElement("span");
      front.className = "front";
      if (book.c) {
        front.append(coverImg(book, true));
      } else {
        front.innerHTML = madeCover();
        front.querySelector("b").textContent = book.t;
        front.querySelector("i").textContent = book.a || "";
      }
      return front;
    }

    function spineEl(book) {
      const spine = document.createElement("span");
      spine.className = "spine";
      if (book.variant === 1) {
        spine.insertAdjacentHTML("beforeend", '<i class="band" style="top:7%;height:3px"></i><i class="band" style="bottom:7%;height:3px"></i>');
      } else if (book.variant === 2) {
        spine.insertAdjacentHTML("beforeend", '<i class="band" style="bottom:0;height:16%"></i>');
      } else if (book.variant === 3) {
        spine.insertAdjacentHTML("beforeend", '<i class="band" style="top:0;height:9%"></i>');
      }
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = book.t;
      spine.append(title);
      if (book.a && book.thick >= 24) {
        const author = document.createElement("span");
        author.className = "author";
        author.textContent = lastName(book.a);
        spine.append(author);
      }
      return spine;
    }

    function ensureFace(el, book) {
      if (book.out || el.querySelector(".face")) return;
      const face = document.createElement("span");
      face.className = "face";
      if (book.c) face.append(coverImg(book, false));
      el.querySelector(".lift").append(face);
    }

    // Measure every title (and author) once at two letter widths. Length scales with font
    // size, and close enough to linearly with the width axis, so each spine can then work out
    // how to fit its own text without measuring again.
    function measureText() {
      const box = document.createElement("div");
      box.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden;contain:layout style;white-space:nowrap;font-family:Anybody,system-ui,sans-serif;font-size:100px;line-height:1;letter-spacing:.01em";
      const spans = [];
      for (const b of books) {
        for (const [text, wd, weight, key] of [[b.t, 50, b.weight, "L50"], [b.t, 150, b.weight, "L150"], [lastName(b.a), 70, 450, "LA"]]) {
          const span = document.createElement("span");
          span.style.cssText = `display:block;width:max-content;font-weight:${weight};font-variation-settings:"wdth" ${wd}`;
          span.textContent = text;
          box.append(span);
          spans.push([b, key, span]);
        }
      }
      document.body.append(box);
      for (const [b, key, span] of spans) b[key] = span.offsetWidth / 100;  // length per px of font size
      box.remove();
    }

    // Fit a spine's title: narrow the letters first, then (on a thick spine) take two lines,
    // then give up the author's name, and only then shrink. Past 8px the ellipsis takes over.
    function fitTitle(b, w, h, showAuthor = !!b.a && b.thick >= 24) {  // as in spineEl
      const afs = Math.min(w * .32, 11);
      // A little slack: an exact fit can still tip into an ellipsis on subpixel rounding.
      const avail = (h - 22 - (showAuthor ? Math.min(afs * b.LA, h * .34) + 8 : 0)) * .94;
      const fs0 = clamp(w * .46, 9, 17);
      const wd0 = clamp(50 + (w - 18) * 2.6, 50, 140);
      const wdFor = (fs, room) => 50 + 100 * (room / fs - b.L50) / (b.L150 - b.L50);
      const wd = Math.min(wd0, wdFor(fs0, avail));
      const hideAuthor = !showAuthor;
      if (wd >= 58) return { fs: fs0, wd, afs, two: false, hideAuthor };
      const fs2 = Math.min(fs0, (w - 8) / 2.1);
      if (fs2 >= 9 && b.t.includes(" ")) {
        // Each line carries a bit over half the title once words break unevenly.
        const wd2 = Math.min(wd0, wdFor(fs2, avail / .6));
        if (wd2 >= 58) return { fs: fs2, wd: wd2, afs, two: true, hideAuthor };
      }
      const len58 = b.L50 + (b.L150 - b.L50) * .08;
      const fs = Math.min(fs0, avail / len58);
      if (fs < 10 && showAuthor) return fitTitle(b, w, h, false);
      return { fs: Math.max(8, fs), wd: 58, afs, two: false, hideAuthor };
    }

    function sizeBooks() {
      const shelfH = parseFloat(getComputedStyle(root).getPropertyValue("--shelf-h"));
      const scale = shelfH / 210;
      for (const b of books) {
        const thick = Math.round(b.thick * Math.max(scale, .78));
        // Face-out books stand a touch shorter so the lean clears the shelf above.
        const h = Math.round(shelfH * (b.out ? .8 + (b.height - .8) * .5 : b.height));
        const w = b.out ? Math.round(h * b.ar) : thick;
        // Thin spines get condensed lettering; fat ones get room to stretch, as far as the title allows.
        const fit = b.out ? { fs: clamp(w * .46, 9, 17), wd: 100, afs: 11, two: false } : fitTitle(b, w, h);
        const { fs, wd, afs } = fit;
        b.el.classList.toggle("two", fit.two);
        b.el.classList.toggle("no-author", !!fit.hideAuthor);
        b.w = w;
        b.el.style.setProperty("--w", w + "px");
        b.el.style.setProperty("--h", h + "px");
        b.el.style.setProperty("--d", (b.out ? thick : Math.round(h * b.ar)) + "px");
        b.el.style.setProperty("--fs", fs.toFixed(1) + "px");
        b.el.style.setProperty("--fw", b.weight);
        b.el.style.setProperty("--wd", Math.round(wd));
        b.el.style.setProperty("--afs", afs.toFixed(1) + "px");
      }
    }

    function lastName(author) {
      return (author || "").split(",")[0].trim().split(" ").slice(-1)[0];
    }

    function groups() {
      if (mode === "author") {
        const list = books.slice().sort((a, b) =>
          norm(lastName(a.a)).localeCompare(norm(lastName(b.a))) ||
          norm(a.a || "").localeCompare(norm(b.a || "")) ||
          a.t.localeCompare(b.t));
        return [{ name: "All books", list, aisle: true }];
      }
      const map = new Map();
      const sorted = books.slice().sort((a, b) => (b.r ?? -1) - (a.r ?? -1) || norm(lastName(a.a)).localeCompare(norm(lastName(b.a))));
      for (const b of sorted) {
        const key = b.r == null ? "none" : String(b.r);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(b);
      }
      return [...map].map(([key, list]) => ({
        name: key === "none" ? "Not rated yet" : `${fmtRating(+key)} stars`,
        list,
      }));
    }

    const GAP = 2;
    // Split a group into rows of roughly equal width, so no shelf holds one stray book.
    function splitRows(list, avail) {
      const total = list.reduce((n, b) => n + b.w + GAP, 0);
      const count = Math.ceil(total / avail);
      const target = total / count;
      const rows = [];
      let row = [], width = 0;
      for (const b of list) {
        const next = width + b.w + GAP;
        if (row.length && (next > avail || (next > target + b.w / 2 && rows.length < count - 1))) {
          rows.push(row);
          row = [];
          width = 0;
        }
        row.push(b);
        width += b.w + GAP;
      }
      if (row.length) rows.push(row);
      return rows;
    }

    function shelfRow(list, labelText, aisle, plants) {
      const row = document.createElement("div");
      row.className = "row";
      const holder = document.createElement("div");
      holder.className = "books";
      holder.append(...list.map(b => b.el));
      // First time the pointer reaches a shelf, start loading every cover on it, so the one
      // you hover is usually already there.
      if (canHover) row.addEventListener("pointerover", () => list.forEach(b => ensureFace(b.el, b)), { once: true });
      for (const p of plants) p.atStart ? holder.prepend(p.el) : holder.append(p.el);
      const plank = document.createElement("div");
      plank.className = "plank";
      if (labelText) {
        const label = document.createElement("div");
        label.className = aisle ? "label aisle" : "label";
        label.innerHTML = "<b></b>";
        label.querySelector("b").textContent = labelText;
        plank.append(label);
        row.classList.add("has-label");
      }
      row.append(holder, plank);
      const shelf = document.createElement("div");
      shelf.className = "shelf";
      shelf.append(row);
      return shelf;
    }

    function layout(animate) {
      books.forEach(fill);
      sizeBooks();
      // Leave slack for perspective, which magnifies the far ends of each shelf.
      const avail = (shelves.clientWidth - (innerWidth <= 720 ? 16 : 28)) * .96;
      const shelfH = parseFloat(getComputedStyle(root).getPropertyValue("--shelf-h"));
      const frag = document.createDocumentFragment();
      order = [];
      let i = 0;
      for (const g of groups()) {
        const group = document.createElement("section");
        group.className = "group";
        group.setAttribute("aria-label", g.name);
        if (!g.aisle) {
          const heading = document.createElement("h2");
          heading.className = "group-name";
          heading.innerHTML = "<span></span><small></small>";
          heading.querySelector("span").textContent = g.name;
          heading.querySelector("small").textContent = `${g.list.length} ${g.list.length === 1 ? "book" : "books"}`;
          group.append(heading);
        }
        // Hold back room on each shelf for a plant, then pot one into most of the gaps.
        splitRows(g.list, avail - Math.round(shelfH * .55)).forEach((list, r) => {
          list.forEach(b => { b.el.style.setProperty("--i", i++); order.push(b); });
          const rand = rng(SEED + mode + view + g.name + r);
          let slack = avail - list.reduce((n, b) => n + b.w + GAP, 0);
          const plants = [];
          while (slack >= 64 && plants.length < 2 && (rand() < .75 || slack > 220)) {
            const w = Math.round(Math.min(slack - 10, shelfH * (.5 + rand() * .3)));
            plants.push({ el: shelfPlant(rand, w, shelfH), atStart: rand() < .25 });
            slack -= w + 10;
          }
          if (g.aisle) {
            // Aisle signs: the authors each plank runs between.
            const first = lastName(list[0].a), last = lastName(list[list.length - 1].a);
            group.append(shelfRow(list, first === last ? first : `${first} to ${last}`, true, plants));
          } else {
            group.append(shelfRow(list, "", false, plants));
          }
        });
        frag.append(group);
      }
      shelves.replaceChildren(frag);
      if (animate && !reduceMotion) {
        shelves.classList.add("entering");
        setTimeout(() => shelves.classList.remove("entering"), 700 + i * 9);
      }
      applyFilter();
    }

    // ---------- Search ----------
    const search = document.querySelector(".search");
    const empty = document.getElementById("empty");
    const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    function applyFilter() {
      const q = norm(search.value.trim());
      shelves.classList.toggle("dimmed", !!q);
      let hits = 0;
      for (const b of books) {
        const hit = !!q && (norm(b.t).includes(q) || norm(b.a || "").includes(q) || norm(b.s || "").includes(q));
        b.el.classList.toggle("match", hit);
        if (hit) hits++;
      }
      empty.classList.toggle("show", !!q && !hits);
      empty.textContent = q && !hits ? `Nothing on the shelf matches “${search.value.trim()}”.` : "";
      if (q && hits) {
        // Scroll by the shelf, not the book: scrollIntoView mismeasures 3D-transformed elements.
        const row = order.find(b => b.el.classList.contains("match")).el.closest(".row");
        const top = row.offsetTop + row.offsetParent.offsetTop - innerHeight / 2 + row.offsetHeight / 2;
        scrollTo({ top: Math.max(0, top), behavior: reduceMotion ? "auto" : "smooth" });
      }
    }
    let searchTimer;
    search.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(applyFilter, 120); });

    document.querySelectorAll(".toggle button").forEach(btn => btn.addEventListener("click", () => {
      const key = btn.dataset.mode ? "mode" : "view";
      const value = btn.dataset[key];
      if (key === "mode" ? value === mode : value === view) return;
      if (key === "mode") mode = value; else view = value;
      btn.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === btn));
      layout(true);
    }));

    // ---------- Detail ----------
    const dialog = document.getElementById("detail");
    const big = document.getElementById("big");
    const stage = document.getElementById("stage");
    let current = null;
    let spin = 0;

    function setSpin(deg, animate) {
      spin = deg;
      big.classList.toggle("turning", !!animate && !reduceMotion);
      big.style.setProperty("--spin", deg + "deg");
    }

    function madeCover() {
      return `<div class="made-cover"><b></b><i></i></div>`;
    }

    function openDetail(id, fromShelf = false) {
      const book = books.find(b => b.id === id);
      current = book;
      const ch = innerWidth <= 720 ? 220 : 300;
      const cw = Math.round(ch * book.ar);
      const t = Math.round(clamp(book.thick * (ch / 210) * .75, 16, 56));
      big.style.cssText = `--cw:${cw}px;--ch:${ch}px;--t:${t}px;--bg:${book.bg};--fg:${book.fg}`;
      big.innerHTML = `
        <div class="bf b-back"></div>
        <div class="bf b-spine"><span></span></div>
        <div class="bf b-edge"></div><div class="bf b-top"></div><div class="bf b-bottom"></div>
        <div class="bf b-cover"></div>`;
      big.querySelector(".b-spine span").textContent = book.t;
      const cover = big.querySelector(".b-cover");
      if (book.c) {
        cover.style.backgroundImage = `url(covers/${book.id}.webp)`;
        big.querySelector(".b-back").style.backgroundImage = `url(covers/${book.id}.webp)`;
      } else {
        cover.innerHTML = madeCover();
        cover.querySelector("b").textContent = book.t;
        cover.querySelector("i").textContent = book.a || "";
      }

      document.getElementById("d-title").textContent = book.t;
      const sub = document.getElementById("d-sub");
      sub.textContent = book.s || "";
      sub.hidden = !book.s;
      document.getElementById("d-by").textContent = book.a ? `by ${book.a}` : "";
      const meter = document.getElementById("d-meter");
      meter.innerHTML = "";
      for (let i = 0; i < 5; i++) {
        const seg = document.createElement("i");
        seg.style.setProperty("--f", book.r == null ? 0 : clamp(book.r - i, 0, 1));
        meter.append(seg);
      }
      meter.hidden = book.r == null;
      document.getElementById("d-rating").textContent = book.r == null
        ? "I didn't rate this one."
        : `Rated ${fmtRating(book.r)} out of 5`;

      const facts = [];
      if (book.d) facts.push(`Finished ${new Date(book.d + "T12:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })}`);
      if (book.p) facts.push(`${book.p.toLocaleString()} pages`);
      const factsEl = document.getElementById("d-facts");
      factsEl.textContent = facts.length ? facts.join(". ") + "." : "";
      if (book.u) {
        factsEl.append(document.createElement("br"));
        const a = document.createElement("a");
        a.href = book.u;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = "See it on Readwise Books";
        factsEl.append(a);
      }

      const others = books.filter(b => b !== book && b.a && lastName(b.a) === lastName(book.a) && b.a.split(" ")[0] === book.a.split(" ")[0]);
      const also = document.getElementById("d-also");
      also.hidden = !others.length;
      if (others.length) {
        also.querySelector("h3").textContent = `Also on the shelf by ${book.a.split(",")[0]}`;
        const list = also.querySelector("div");
        list.replaceChildren(...others.map(o => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.title = o.t;
          btn.setAttribute("aria-label", o.t);
          btn.style.cssText = `--bg:${o.bg};--fg:${o.fg};--g:${glowOf(o.r).toFixed(2)};--w:58px`;
          btn.append(frontEl(o));
          btn.addEventListener("click", () => openDetail(o.id));
          return btn;
        }));
      }

      // The book being looked at is off its shelf.
      books.forEach(b => b.el.classList.toggle("away", b === book));
      stopCoast();
      if (!dialog.open) {
        dialog.showModal();
        dialog.focus();
        if (fromShelf && !reduceMotion && flyFromShelf(book)) return;
        if (!reduceMotion) { dialog.classList.add("arriving"); setTimeout(() => dialog.classList.remove("arriving"), 800); }
      }
      // Moving between books in the panel: arrive spine-on, then turn to show the cover.
      if (reduceMotion) { setSpin(22, false); return; }
      setSpin(90, false);
      requestAnimationFrame(() => requestAnimationFrame(() => setSpin(22, true)));
    }

    // Where the book sits on the shelf, as a transform for the panel's book: offset from the
    // stage's center, scaled down to shelf size, spine-on (or cover-on for face-out books).
    function shelfPose(book) {
      const from = book.el.getBoundingClientRect();
      if (from.bottom < 0 || from.top > innerHeight || !from.width) return null;  // off screen
      const stageBox = stage.getBoundingClientRect();
      const dx = from.left + from.width / 2 - (stageBox.left + stageBox.width / 2);
      const dy = from.top + from.height / 2 - (stageBox.top + stageBox.height / 2);
      const s = from.height / parseFloat(big.style.getPropertyValue("--ch"));
      return { dx, dy, s, rot: book.out ? 0 : 90, tilt: book.out ? 5 : 0 };
    }

    // Pull the book off the shelf: it slides forward out of its slot, then flies to the
    // middle of the panel turning to show its cover, while the panel fades in around it.
    function flyFromShelf(book) {
      const p = shelfPose(book);
      if (!p) return false;
      dialog.classList.add("flying", "arriving");
      setSpin(22, false);
      // Each phase has its own easing: a quick tug out of the slot, then an unhurried glide.
      const anim = big.animate([
        { transform: `translate(${p.dx}px, ${p.dy}px) scale(${p.s}) rotateX(${p.tilt}deg) rotateY(${p.rot}deg)`, easing: "cubic-bezier(.3, 0, .3, 1)" },
        { transform: `translate(${p.dx}px, ${p.dy - 18}px) scale(${p.s * 1.12}) rotateX(${p.tilt}deg) rotateY(${p.rot}deg)`, offset: .2, easing: "cubic-bezier(.45, 0, .2, 1)" },
        { transform: "translate(0px, 0px) scale(1) rotateX(8deg) rotateY(22deg)" },
      ], { duration: 950 });
      anim.onfinish = anim.oncancel = () => {
        dialog.classList.remove("flying", "arriving");
      };
      return true;
    }

    // Put the book back: it flies home into its slot and the panel fades away.
    function closeDetail() {
      if (!dialog.open || dialog.classList.contains("leaving")) return;
      stopCoast();
      const book = current;
      const p = !reduceMotion && book && shelfPose(book);
      const finish = () => {
        dialog.classList.remove("flying", "leaving", "arriving");
        dialog.close();
        book?.el.classList.remove("away");
      };
      if (!p) { finish(); return; }
      // Turn back the shorter way round, however far it's been spun.
      const home = p.rot + 360 * Math.round((spin - p.rot) / 360);
      dialog.classList.add("flying", "leaving");
      const anim = big.animate([
        { transform: `translate(0px, 0px) scale(1) rotateX(8deg) rotateY(${spin}deg)`, easing: "cubic-bezier(.5, 0, .25, 1)" },
        { transform: `translate(${p.dx}px, ${p.dy - 18}px) scale(${p.s * 1.12}) rotateX(${p.tilt}deg) rotateY(${home}deg)`, offset: .78, easing: "cubic-bezier(.4, 0, .4, 1)" },
        { transform: `translate(${p.dx}px, ${p.dy}px) scale(${p.s}) rotateX(${p.tilt}deg) rotateY(${home}deg)` },
      ], { duration: 750, fill: "forwards" });
      anim.onfinish = () => { finish(); anim.cancel(); };
    }

    function step(dir) {
      const idx = order.indexOf(current);
      const next = order[(idx + dir + order.length) % order.length];
      openDetail(next.id);
    }

    dialog.addEventListener("click", e => {
      if (e.target === dialog || e.target.closest("[data-close]")) closeDetail();
      const s = e.target.closest("[data-step]");
      if (s) step(+s.dataset.step);
    });
    dialog.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") step(1);
      if (e.key === "ArrowLeft") step(-1);
    });
    // Escape closes through the same put-it-back animation.
    dialog.addEventListener("cancel", e => { e.preventDefault(); closeDetail(); });
    // Hand focus back to the book; only show the focus pose if the keyboard was in use.
    let usingPointer = false;
    addEventListener("pointerdown", () => { usingPointer = true; }, { capture: true, passive: true });
    addEventListener("keydown", () => { usingPointer = false; }, { capture: true });
    dialog.addEventListener("close", () => {
      books.forEach(b => b.el.classList.remove("away"));
      current?.el.focus({ preventScroll: true, focusVisible: !usingPointer });
    });

    // Drag to turn. Let go mid-drag and the book keeps spinning, slowing under friction.
    let drag = null, coast = 0;
    const stopCoast = () => cancelAnimationFrame(coast);
    stage.addEventListener("pointerdown", e => {
      stopCoast();
      drag = { x: e.clientX, start: spin, lastX: e.clientX, lastT: e.timeStamp, v: 0 };
      stage.setPointerCapture(e.pointerId);
      big.classList.remove("turning");
    });
    stage.addEventListener("pointermove", e => {
      if (!drag) return;
      const dt = e.timeStamp - drag.lastT;
      if (dt > 0) drag.v = drag.v * .2 + ((e.clientX - drag.lastX) * .6 / dt) * .8;  // degrees per ms
      drag.lastX = e.clientX;
      drag.lastT = e.timeStamp;
      setSpin(drag.start + (e.clientX - drag.x) * .6, false);
    });
    const endDrag = e => {
      if (!drag) return;
      // A pause before letting go means no flick.
      let v = e.timeStamp - drag.lastT > 80 ? 0 : clamp(drag.v, -2.5, 2.5);
      drag = null;
      if (reduceMotion || Math.abs(v) < .02) return;
      let last = performance.now();
      const step = now => {
        const dt = Math.min(now - last, 40);
        last = now;
        setSpin(spin + v * dt, false);
        v *= Math.pow(.955, dt / 16.7);
        if (Math.abs(v) > .005) coast = requestAnimationFrame(step);
      };
      coast = requestAnimationFrame(step);
    };
    stage.addEventListener("pointerup", endDrag);
    stage.addEventListener("pointercancel", endDrag);

    // ---------- Boot ----------
    buildRoom();
    Promise.all([
      fetch("data/books.json").then(r => r.json()),
      document.fonts.load('600 16px Anybody').catch(() => {}),
    ]).then(([data]) => {
      books = data;
      books.forEach(decorate);
      books.forEach(bookEl);
      measureText();

      const pages = books.reduce((n, b) => n + (b.p || 0), 0);
      const fives = books.filter(b => b.r === 5).length;
      document.getElementById("summary").innerHTML =
        `<strong>${books.length} books</strong> finished, more than ${(Math.floor(pages / 1000) * 1000).toLocaleString()} pages. ` +
        `The better I rated a book, the more it <span class="glow-word">glows</span>. My favorites stand face-out. ${fives} got five stars.`;

      layout(true);
      let w = innerWidth, t;
      addEventListener("resize", () => {
        clearTimeout(t);
        t = setTimeout(() => {
          if (innerWidth === w) return;
          w = innerWidth;
          layout(false);
          buildRoom();
        }, 120);
      });
    }).catch(() => {
      document.getElementById("summary").textContent = "The shelf didn't load. Refresh the page to try again.";
    });
  })();
  </script>
</body>
</html>
